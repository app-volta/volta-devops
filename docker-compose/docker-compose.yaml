name: volta

services:
  postgres:
    image: postgres:16-alpine
    container_name: volta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: volta
      POSTGRES_USER: volta
      POSTGRES_PASSWORD: volta_local
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volta -d volta"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: volta-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: volta
      MONGO_INITDB_ROOT_PASSWORD: volta_local
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: volta-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "96mb"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../../volta-api
    container_name: volta-api
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/volta
      SPRING_DATASOURCE_USERNAME: volta
      SPRING_DATASOURCE_PASSWORD: volta_local
      JWT_KEY: ${JWT_KEY}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  api-redis:
    build:
      context: ../../volta-api-redis
    container_name: volta-api-redis
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      VOLTA_API_URL: http://api:8080
      JWT_KEY: ${JWT_KEY}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  chatbot:
    build:
      context: ../../volta-chatbot
    container_name: volta-chatbot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgresql://volta:volta_local@postgres:5432/volta
      MONGO_URI: mongodb://volta:volta_local@mongo:27017/volta_memory?authSource=admin
      ENVIRONMENT: qa
      RAG_BASE_PATH: ./data/faiss
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  postgres-data:
  mongo-data:
  redis-data:
