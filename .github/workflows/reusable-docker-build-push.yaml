name: Reusable - Build e push da imagem no GHCR

on:
  workflow_call:
    inputs:
      image-name:
        description: Nome da imagem no GHCR
        required: true
        type: string
      context:
        description: Contexto de build do Docker
        required: false
        type: string
        default: .
      dockerfile:
        description: Caminho do Dockerfile
        required: false
        type: string
        default: ./Dockerfile
      push:
        description: Se falso, apenas constrói (sem publicar)
        required: false
        type: boolean
        default: true
      moving-tag:
        description: Tag móvel adicional (qa ou latest). Vazio para nenhuma.
        required: false
        type: string
        default: ''
    outputs:
      image-tag:
        description: Tag imutável gerada (sha-xxxxxxx)
        value: ${{ jobs.docker.outputs.image-tag }}

jobs:
  docker:
    name: docker
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Calcular nome e tags da imagem
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ inputs.image-name }}
          MOVING_TAG: ${{ inputs.moving-tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"
          IMAGE="ghcr.io/${OWNER}/${IMAGE_NAME}"
          IMAGE="${IMAGE,,}"

          TAGS="${IMAGE}:sha-${SHORT_SHA}"
          if [ -n "$MOVING_TAG" ]; then
            TAGS="${TAGS},${IMAGE}:${MOVING_TAG}"
          fi

          {
            echo "image=${IMAGE}"
            echo "image-tag=sha-${SHORT_SHA}"
            echo "tags=${TAGS}"
          } >> "$GITHUB_OUTPUT"

          echo "Imagem: ${IMAGE}"
          echo "Tags:   ${TAGS}"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Registrar resumo da publicação
        if: inputs.push
        run: |
          {
            echo "### Imagem publicada no GHCR"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Imagem | \`${{ steps.meta.outputs.image }}\` |"
            echo "| Tag imutável | \`${{ steps.meta.outputs.image-tag }}\` |"
            echo "| Tag móvel | \`${{ inputs.moving-tag || 'nenhuma' }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
