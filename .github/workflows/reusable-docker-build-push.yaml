name: Reusable - Build e push da imagem no GHCR

on:
  workflow_call:
    inputs:
      image-name:
        description: Nome da imagem no GHCR (api, api-redis ou chatbot)
        required: true
        type: string
      environment:
        description: Ambiente alvo (qa ou prod) — define o prefixo da tag
        required: true
        type: string
      context:
        description: Contexto de build do Docker
        required: false
        type: string
        default: .
      dockerfile:
        description: Caminho do Dockerfile
        required: false
        type: string
        default: ./Dockerfile
      push:
        description: Se falso, apenas constrói (sem publicar)
        required: false
        type: boolean
        default: true
      notify-devops:
        description: Dispara o deploy no repositório DevOps após publicar
        required: false
        type: boolean
        default: false
      devops-repository:
        description: Repositório que recebe o repository_dispatch
        required: false
        type: string
        default: app-volta/volta-devops
    secrets:
      devops-dispatch-token:
        description: PAT com escrita no DevOps. Obrigatório se notify-devops.
        required: false
    outputs:
      image:
        description: Imagem sem tag (ex.- ghcr.io/app-volta/api)
        value: ${{ jobs.docker.outputs.image }}
      image-tag:
        description: Tag imutável gerada (ex.- qa-a1b2c3d)
        value: ${{ jobs.docker.outputs.image-tag }}

jobs:
  docker:
    name: docker
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.image }}
      image-tag: ${{ steps.meta.outputs.image-tag }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Calcular nome e tags da imagem
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ inputs.image-name }}
          ENVIRONMENT: ${{ inputs.environment }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # A tag carrega o ambiente porque é o que impede promover uma imagem
          # de QA para produção sem passar pelo build de produção.
          case "$ENVIRONMENT" in
            qa)   MOVING_TAG="qa" ;;
            prod) MOVING_TAG="latest" ;;
            *) echo "::error::Ambiente inválido: '${ENVIRONMENT}'. Aceitos: qa, prod."; exit 1 ;;
          esac

          SHORT_SHA="${COMMIT_SHA:0:7}"
          IMAGE="ghcr.io/${OWNER}/${IMAGE_NAME}"
          IMAGE="${IMAGE,,}"

          IMMUTABLE_TAG="${ENVIRONMENT}-${SHORT_SHA}"
          TAGS="${IMAGE}:${IMMUTABLE_TAG},${IMAGE}:${MOVING_TAG}"

          {
            echo "image=${IMAGE}"
            echo "image-tag=${IMMUTABLE_TAG}"
            echo "moving-tag=${MOVING_TAG}"
            echo "tags=${TAGS}"
          } >> "$GITHUB_OUTPUT"

          echo "Imagem: ${IMAGE}"
          echo "Tags:   ${TAGS}"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Avisar o DevOps para implantar
        if: inputs.push && inputs.notify-devops
        env:
          DISPATCH_TOKEN: ${{ secrets.devops-dispatch-token }}
          DEVOPS_REPO: ${{ inputs.devops-repository }}
          SERVICE: ${{ inputs.image-name }}
          ENVIRONMENT: ${{ inputs.environment }}
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.image-tag }}
          COMMIT_SHA: ${{ github.sha }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          # O GITHUB_TOKEN do repositório de origem NÃO dispara dispatch
          # cross-repo. Falhar explicitamente é melhor que um deploy silencioso
          # que nunca acontece.
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::error::Secret 'devops-dispatch-token' ausente — impossível disparar o deploy."
            echo "::error::Crie um PAT com escrita em ${DEVOPS_REPO} e salve como DEVOPS_DISPATCH_TOKEN."
            exit 1
          fi

          PAYLOAD=$(printf '{"event_type":"deploy","client_payload":{"service":"%s","env":"%s","image":"%s","tag":"%s","commit":"%s","source_repository":"%s"}}' \
            "$SERVICE" "$ENVIRONMENT" "$IMAGE" "$TAG" "$COMMIT_SHA" "$SOURCE_REPO")

          HTTP_CODE=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' \
            -X POST "https://api.github.com/repos/${DEVOPS_REPO}/dispatches" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$PAYLOAD")

          if [ "$HTTP_CODE" != "204" ]; then
            echo "::error::Dispatch para ${DEVOPS_REPO} falhou (HTTP ${HTTP_CODE})."
            cat /tmp/dispatch.out
            exit 1
          fi

          echo "Deploy de ${SERVICE} (${ENVIRONMENT}) solicitado ao ${DEVOPS_REPO}."

      - name: Registrar resumo da publicação
        if: inputs.push
        run: |
          {
            echo "### Imagem publicada no GHCR"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Imagem | \`${{ steps.meta.outputs.image }}\` |"
            echo "| Tag imutável | \`${{ steps.meta.outputs.image-tag }}\` |"
            echo "| Tag móvel | \`${{ steps.meta.outputs.moving-tag }}\` |"
            echo "| Ambiente | \`${{ inputs.environment }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Deploy disparado | \`${{ inputs.notify-devops }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
