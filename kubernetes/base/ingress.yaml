apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: volta
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: api.0.0.0.0.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080

    - host: ranking.0.0.0.0.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-redis
                port:
                  number: 8081

    - host: chat.0.0.0.0.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chatbot
                port:
                  number: 8000
