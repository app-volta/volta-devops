apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: volta-prod

resources:
  - ../../base
  - configmap.yaml

commonLabels:
  environment: prod
  app.kubernetes.io/part-of: volta

images:
  - name: ghcr.io/app-volta/api
    newTag: prod
  - name: ghcr.io/app-volta/api-redis
    newTag: prod
  - name: ghcr.io/app-volta/chatbot
    newTag: prod

patches:
  - path: resources-patch.yaml
    target:
      kind: Deployment
      name: "^(api|api-redis|chatbot)$"

  - target:
      kind: Ingress
      name: volta
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: api.0.0.0.0.sslip.io
      - op: replace
        path: /spec/rules/1/host
        value: ranking.0.0.0.0.sslip.io
      - op: replace
        path: /spec/rules/2/host
        value: chat.0.0.0.0.sslip.io
