apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: volta
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  tls:
    - hosts:
        - api.qa.0.0.0.0.sslip.io
        - ranking.qa.0.0.0.0.sslip.io
        - chat.qa.0.0.0.0.sslip.io
      secretName: volta-qa-tls
