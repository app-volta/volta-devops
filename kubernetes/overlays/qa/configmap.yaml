# Configuração NÃO sensível do ambiente de QA.
#
# Senha de banco, chave de LLM e JWT_SECRET NÃO entram aqui — eles vivem em
# Secrets criados manualmente no cluster (`kubectl create secret`), porque este
# arquivo é versionado em repositório público.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
data:
  SPRING_PROFILES_ACTIVE: "qa"
  SERVER_PORT: "8080"
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_APP: "DEBUG"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chatbot-config
data:
  ENVIRONMENT: "qa"
  PORT: "8000"
  LOG_LEVEL: "DEBUG"
  # Endereço interno da API dentro do mesmo namespace: o Kubernetes resolve
  # o nome do Service, sem precisar saber IP de container.
  API_BASE_URL: "http://api:8080"
