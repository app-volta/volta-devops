apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
data:
  SPRING_PROFILES_ACTIVE: "qa"
  SERVER_PORT: "8080"
  SPRING_JPA_SHOW_SQL: "true"
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_COM_VOLTA: "DEBUG"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-redis-config
data:
  SPRING_PROFILES_ACTIVE: "qa"
  SERVER_PORT: "8081"
  VOLTA_API_URL: "http://api:8080"
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_COM_VOLTA: "DEBUG"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chatbot-config
data:
  ENVIRONMENT: "qa"
  PORT: "8000"
  LOG_LEVEL: "DEBUG"
  VOLTA_LANGSMITH_ENABLED: "true"
  LANGSMITH_PROJECT: "volta-chatbot-qa"
  LANGSMITH_ENDPOINT: "https://api.smith.langchain.com"