apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: volta-qa

resources:
- ../../base
- configmap.yaml

commonLabels:
  app.kubernetes.io/part-of: volta
  environment: qa

images:
- name: ghcr.io/app-volta/api
  newTag: qa
- name: ghcr.io/app-volta/api-redis
  newTag: qa
- name: ghcr.io/app-volta/chatbot
  newTag: qa

patches:
- path: https-patch.yaml
  target:
    kind: Ingress
    name: volta
- path: replicas-patch.yaml
  target:
    kind: Deployment
    name: "^(api|api-redis|chatbot)$"
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: api.qa.0.0.0.0.sslip.io
    - op: replace
      path: /spec/rules/1/host
      value: ranking.qa.0.0.0.0.sslip.io
    - op: replace
      path: /spec/rules/2/host
      value: chat.qa.0.0.0.0.sslip.io
  target:
    kind: Ingress
    name: volta
